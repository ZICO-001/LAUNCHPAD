<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOB-SEEKER DASHBOARD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Applypage.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <div class="search-box">
        <img src="images/Browse-job-icon.png" alt="" />
        <input type="text" placeholder="Search jobs, companies or skills..." />
      </div>

      <div class="header-right">
        <img src="images/notification-icon.png" alt="" />

        <div class="user">
          <div class="avatar">TA</div>

          <div>
            <h5>Tunde Akinleye</h5>
            <span>Job Seeker</span>
          </div>
        </div>
      </div>
    </header>

    <!-- side bar -->
    <section class="sidebar">
      <div class="logo">
        <img src="images/launchpad logo.png" alt="" />
        <h1>LaunchPad</h1>
      </div>
      <nav class="navbar">
        <div class="home">
          <img src="images/Home-icon.png" alt="" />
          <a href="Job-Seeker.html">Home</a>
        </div>
        <div class="browse">
          <img src="images/Browse-job-icon.png" alt="" />
          <a href="#">Browse Job</a>
        </div>
        <div class="Saved-job">
          <img src="images/saved-job-icon.png" alt="" />
          <a href="#">Saved Jobs</a>
        </div>
        <div class="My-Application">
          <img src="images/APPLICATION-icon.png" alt="" />
          <a href="Appllication.html">My Applications</a>
        </div>
        <div class="profile">
          <img src="images/profile-icon.png" alt="" />
          <a href="#">Profile</a>
        </div>
      </nav>

      <div class="profile-card">
        <img src="images/progress-Icon.png" alt="" />
        <h4>Level up your profile</h4>
        <p>Complete your profile to get more interview calls.</p>

        <div class="progress-bar">
          <div class="progress"></div>
        </div>
        <div class="profile-progress">
          <a href="#">Complete Profile </a>
          <a href="">→</a>
        </div>
      </div>
      <div class="sidebar-bottom">
        <img src="images/logout-Icon.png" alt="" />
        <p>Logout</p>
      </div>
    </section>
    <main class="main">
      <div class="Apply">
        <img src="loginImages/arrow-icon.png" alt="" />
        <h2>Apply For Job</h2>
      </div>
      <section class="form-section">
        <div class="form-heading">
          <div class="nav-heading">
            <div class="card-1">
              <p class="num1">1</p>
              <a href="">Confirm details</a>
            </div>
            <!--  -->
            <div class="card-2">
              <p class="num2">2</p>
              <a href="">Upload Resume</a>
            </div>
            <!--  -->
            <div class="card-3">
              <p class="num3">3</p>
              <a href="#preview">Preview</a>
            </div>
          </div>
          <!--  -->

          <form action="">
            <h2>Basic information</h2>
            <div class="FullName">
              <label for="text">Full Name</label>
              <input type="email" name="" id="" placeholder="Tunde Adeleke" />
            </div>
            <!--  -->
            <div class="email">
              <label for="email">Email </label>
              <input
                type="email"
                name=""
                id=""
                placeholder="tundeadeleke@gmail.com"
              />
            </div>

            <!--  -->
            <div class="Contact">
              <label for="number">Phone Number</label>
              <input
                type="number"
                name=""
                id=""
                placeholder="+234 804 893 8444"
              />
            </div>
            <!--  -->
            <div class="location">
              <label for="location">Lagos, Nigeria</label>
              <input type="text" name="" id="" placeholder="Lagos, Nigeria" />
            </div>
            <!--  -->
            <div class="Profile-Link">
              <label for="profile">Profile Link (Optional)</label>
              <input type="" name="" id="" placeholder="" />
            </div>
            <!--  -->
            <div class="Linkedin-Profile">
              <label for="profile">Linkedin Profile (Optional)</label>
              <input type="" name="" id="" placeholder="" />
            </div>
          </form>
          <button type="button">Next Step →</button>
        </div>
      </section>

      <section id="Preiew">
        <form action="" class="Preview">
          <h2>Basic information</h2>
          <div class="FullNam">
            <label for="text">Full Name</label>
            <input type="email" name="" id="" placeholder="Tunde Adeleke" />
          </div>
          <!--  -->
          <div class="Email">
            <label for="email">Email </label>
            <input
              type="email"
              name=""
              id=""
              placeholder="tundeadeleke@gmail.com"
            />
          </div>

          <!--  -->
          <div class="contact">
            <label for="number">Phone Number</label>
            <input
              type="number"
              name=""
              id=""
              placeholder="+234 804 893 8444"
            />
          </div>
          <!--  -->
          <div class="location">
            <label for="location">Lagos, Nigeria</label>
            <input type="text" name="" id="" placeholder="Lagos, Nigeria" />
          </div>
          <!--  -->
          <div class="Profile-Link">
            <label for="profile">Profile Link (Optional)</label>
            <input type="" name="" id="" placeholder="" />
          </div>
          <!--  -->
          <div class="Linkedin-Profile">
            <label for="profile">Linkedin Profile (Optional)</label>
            <input type="" name="" id="" placeholder="" />
          </div>
        </form>
        <button type="button">Sumbit Application →</button>
      </section>
    </main>
  </body>
</html>
