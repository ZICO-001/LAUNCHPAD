<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicants — LaunchPad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="EmployerDashboard.css" />
    <link rel="stylesheet" href="Employerapplicants .css" />
  </head>
  <body>
    <!-- ── HEADER ── -->
    <header class="header">
      <div class="search-box">
        <img src="images/Browse-job-icon.png" alt="" />
        <input
          type="text"
          id="searchInput"
          placeholder="Search applicants, jobs, tasks..."
        />
      </div>
      <div class="header-right">
        <img src="images/notification-icon.png" alt="" id="notificationBtn" />
        <div class="user">
          <div class="avatar" id="userAvatar">SJ</div>
          <div>
            <h5 id="userName">Sarah Johnson</h5>
            <span>Admin</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ── SIDEBAR ── -->
    <section class="sidebar">
      <div class="logo">
        <img src="images/launchpad logo.png" alt="" />
        <h1>LaunchPad</h1>
      </div>
      <nav class="navbar">
        <div id="nav-home">
          <img src="images/Home-icon.png" alt="" />
          <a href="#">Home</a>
        </div>
        <div id="nav-jobs">
          <img src="images/Browse-job-icon.png" alt="" />
          <a href="#">Jobs</a>
        </div>
        <div class="active-nav" id="nav-applicants">
          <img src="images/APPLICATION-icon.png" alt="" />
          <a href="#">Applicants</a>
        </div>
        <div id="nav-pipeline">
          <img src="images/saved-job-icon.png" alt="" />
          <a href="#">Pipeline</a>
        </div>
        <div id="nav-profile">
          <img src="images/profile-icon.png" alt="" />
          <a href="#">Company Profile</a>
        </div>
      </nav>
      <div class="sidebar-bottom" id="logoutBtn">
        <img src="images/logout-Icon.png" alt="" />
        <p>Logout</p>
      </div>
    </section>

    <!-- ── MAIN ── -->
    <main class="main">
      <!-- Page heading -->
      <div class="applicants-head">
        <div>
          <h2>Applicants</h2>
          <p id="applicantsMeta">— Applicants • updated just now</p>
        </div>
        <button class="filter-btn" id="filterBtn">
          Filter <span>&#9776;</span>
        </button>
      </div>

      <!-- Filter dropdown (hidden by default) -->
      <div class="filter-panel" id="filterPanel">
        <div class="filter-group">
          <label>Status</label>
          <select id="filterStatus">
            <option value="">All</option>
            <option value="under_review">Under Review</option>
            <option value="interview">Interview</option>
            <option value="shortlisted">Shortlisted</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Location</label>
          <input type="text" id="filterLocation" placeholder="e.g. Lagos" />
        </div>
        <div class="filter-group">
          <label>Job Role</label>
          <input
            type="text"
            id="filterRole"
            placeholder="e.g. UI/UX Designer"
          />
        </div>
        <button class="apply-filter-btn" id="applyFilterBtn">
          Apply Filter
        </button>
        <button class="clear-filter-btn" id="clearFilterBtn">Clear</button>
      </div>

      <!-- Applicants list -->
      <div class="applicants-list" id="applicantsList">
        <!-- Injected by JS -->
      </div>

      <!-- Loading / empty states -->
      <div id="loadingState" class="loading-state">Loading applicants...</div>
      <div id="emptyState" class="empty-state" style="display: none">
        No applicants found.
      </div>
    </main>

    <script src="EmployerApplicants.js"></script>
  </body>
</html>
